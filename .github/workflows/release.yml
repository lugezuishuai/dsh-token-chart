name: release

# 发布流水线：package.json 的版本号是唯一真源。
#
#   · 推送到 main（含 PR 合并产生的 merge commit）→ 跑门禁；若该版本还不在 npm 上，
#     就发布到 npm、打 git tag、建 GitHub Release
#   · 手动触发（workflow_dispatch）→ 可先递增版本，再走同一条路径
#
# 版本已存在于 npm 时只跑门禁并跳过发布，所以日常推送到 main 不会失败。
# 预发布版本永远不会移动 latest：dist-tag 自动取 preid（0.1.1-rc.1 → rc）。
#
# 认证：npm Trusted Publishing（OIDC），仓库里不存任何 npm token。
#   一次性前置（在 npmjs 上做）：本包 → Settings → Trusted Publisher →
#   GitHub Actions，填 owner `lugezuishuai`、repo `dsh-token-chart`、
#   workflow filename `release.yml`。npm CLI 需 ≥ 11.5.1，故下面显式升级 npm。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 发布前递增版本；none = 直接用 package.json 里的版本
        type: choice
        default: none
        options: [none, prerelease, prepatch, patch, preminor, minor, premajor, major]
      preid:
        description: 预发布标识（prerelease / prepatch / preminor / premajor 时生效）
        type: string
        default: rc
      dist_tag:
        description: 手动指定 npm dist-tag；留空 = 正式版 latest、预发布版取 preid
        type: string
        default: ''

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # 打 tag / 建 Release / 把版本提交推回 main
  id-token: write # npm trusted publishing（OIDC）必需

jobs:
  release:
    runs-on: ubuntu-latest
    # 版本递增会把提交推回 main，这里挡掉自我触发（提交信息里也带 [skip ci] 双保险）
    if: github.actor != 'github-actions[bot]'
    env:
      PACKAGE: dsh-token-chart
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 不传 registry-url：它会写出 `_authToken=${NODE_AUTH_TOKEN}` 占位行，
      # 而本项目 .npmrc 已把 registry 固定到 npmjs，认证交给 OIDC 更干净。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 升级 npm（trusted publishing 需要 ≥ 11.5.1）
        run: npm install -g npm@latest

      - name: 环境自检
        run: |
          echo "npm      : $(npm --version)"
          echo "node     : $(node --version)"
          echo "registry : $(npm config get registry)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC     : available"
          else
            echo "OIDC     : MISSING（trusted publishing 会失败）"
          fi

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 门禁（typecheck + build + preflight + 宿主用例）
        run: npm run check

      - name: 递增版本（仅手动触发且 bump != none）
        if: inputs.bump != '' && inputs.bump != 'none'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version '${{ inputs.bump }}' --preid '${{ inputs.preid }}' -m 'chore(release): %s [skip ci]'
          git push origin HEAD:main

      - name: 解析版本与 dist-tag
        id: meta
        run: |
          V="$(node -p "require('./package.json').version")"
          TAG='${{ inputs.dist_tag }}'
          if printf '%s' "$V" | grep -q -- '-'; then
            # 预发布：dist-tag 取 preid，latest 永远留给正式版
            PRE="${V#*-}"; PRE="${PRE%%.*}"
            [ -z "$TAG" ] && TAG="$PRE"
          else
            [ -z "$TAG" ] && TAG=latest
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本 $V → dist-tag $TAG"

      - name: 发布到 npm（OIDC，不需要任何 secret）
        id: publish
        run: |
          V='${{ steps.meta.outputs.version }}'
          if npm view "$PACKAGE@$V" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::$PACKAGE@$V 已存在于 npm，跳过发布"
          else
            npm publish --tag '${{ steps.meta.outputs.dist_tag }}' --provenance
          fi

      - name: 打 tag 并建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V='${{ steps.meta.outputs.version }}'
          git tag -a "v$V" -m "v$V" 2>/dev/null || echo "tag v$V 已存在"
          git push origin "v$V" 2>/dev/null || echo "tag v$V 已存在或无需推送"
          # 预发布版本在 GitHub 上标记为 pre-release，避免被当成正式版
          if printf '%s' "$V" | grep -q -- '-'; then PRE='--prerelease'; else PRE=''; fi
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "v$V" $PRE --generate-notes
